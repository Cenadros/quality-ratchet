[project]
name = "quality-ratchet"
version = "0.1.2"
description = "Monotonic code-quality KPI: per-metric ratchet gate plus a 0-100 score, language-agnostic"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "lizard==1.24.0"]

[project.scripts]
quality-ratchet = "quality_ratchet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quality_ratchet*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
